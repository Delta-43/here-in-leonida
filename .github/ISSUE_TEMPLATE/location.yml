name: Location fix or new location
description: Report a wrong position, a missing location or wrong details.
labels: [content]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Name, or the link from the map (it contains the id), or "new".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong or missing
      description: In your own words. Please do not paste text from guide sites.
    validations:
      required: true
  - type: input
    id: position
    attributes:
      label: Position
      description: Copy the coordinates from the map (long-press, "copy position") if you can.
  - type: input
    id: version
    attributes:
      label: Game version you checked it in
      placeholder: "1.01"
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag an image here. Crop out your PSN name.
  - type: checkboxes
    id: confirm
    attributes:
      label: Source
      options:
        - label: I checked this in the game myself
