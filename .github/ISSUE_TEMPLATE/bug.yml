name: Bug report
description: Something in the app does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 19
    validations:
      required: true
